experiment_name: camels531_syn_S3_n00_h256_seed1
run_dir: ./runs
train_basin_file: ./basin_lists/camels_531_basins.txt
validation_basin_file: ./basin_lists/camels_531_basins.txt
test_basin_file: ./basin_lists/camels_531_basins.txt
train_start_date: 01/10/1999
train_end_date: 30/09/2008
validation_start_date: 01/10/1980
validation_end_date: 30/09/1989
test_start_date: 01/10/1989
test_end_date: 30/09/1999
seed: 1
device: cuda:0
validate_every: 1
validate_n_random_basins: 75
metrics:
- NSE
- KGE
- FHV
- FMS
- FLV
model: cudalstm
head: regression
output_activation: linear
hidden_size: 256
initial_forget_bias: 3
output_dropout: 0.4
optimizer: Adam
loss: NSE
learning_rate:
  0: 1e-3
  20: 5e-4
  25: 1e-4
batch_size: 256
epochs: 30
clip_gradient_norm: 1
predict_last_n: 1
seq_length: 365
num_workers: 8
log_interval: 5
log_tensorboard: true
save_weights_every: 1
