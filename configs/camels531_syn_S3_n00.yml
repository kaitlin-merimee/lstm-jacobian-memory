dataset: camels_us
data_dir: ./data/CAMELS_US
forcings:
- daymet
dynamic_inputs:
- prcp(mm/day)
- srad(W/m2)
- tmax(C)
- tmin(C)
- vp(Pa)
target_variables:
- q_syn
clip_targets_to_zero:
- q_syn
static_attributes:
- p_mean
- pet_mean
- p_seasonality
- frac_snow
- aridity
- high_prec_freq
- high_prec_dur
- low_prec_freq
- low_prec_dur
- elev_mean
- slope_mean
- area_gages2
- frac_forest
- lai_max
- lai_diff
- gvf_max
- gvf_diff
- soil_depth_pelletier
- soil_depth_statsgo
- soil_porosity
- soil_conductivity
- max_water_content
- sand_frac
- silt_frac
- clay_frac
- carbonate_rocks_frac
- geol_permeability
additional_feature_files:
- ./data/synthetic/syn_S3_n00.p
