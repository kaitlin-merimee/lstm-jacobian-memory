# ============================================================
# CAMELS US / Daymet benchmark LSTM (Kratzert-style backbone)
# for Jacobian interpretability analysis.
#
# Replicates the standard gauged-benchmark setup:
#   531 basins, Daymet forcing, 27 static attributes,
#   1-layer LSTM h=256, dropout 0.4, seq 365, basin-averaged NSE loss,
#   train 1999-2008 / val 1980-1989 / test 1989-1999.
#
# NOTE: train with cudalstm (fast, fused cuDNN). For the Jacobian
# analysis, load these weights into a CustomLSTM afterwards --
# see neuralhydrology "Inspecting LSTM states" tutorial.
# ============================================================

# --- Experiment ---
experiment_name: camels531_daymet_h256_seed1
run_dir: ./runs

# --- Basins ---
train_basin_file: ./basin_lists/camels_531_basins.txt
validation_basin_file: ./basin_lists/camels_531_basins.txt
test_basin_file: ./basin_lists/camels_531_basins.txt

# --- Periods (standard Kratzert benchmark split, DD/MM/YYYY) ---
train_start_date: "01/10/1999"
train_end_date: "30/09/2008"
validation_start_date: "01/10/1980"
validation_end_date: "30/09/1989"
test_start_date: "01/10/1989"
test_end_date: "30/09/1999"

seed: 1                  # rerun with seeds 2, 3 for a small ensemble
device: cuda:0

# --- Validation during training ---
validate_every: 1
validate_n_random_basins: 75
metrics:
  - NSE
  - KGE
  - FHV
  - FMS
  - FLV

# --- Model ---
model: cudalstm
head: regression
output_activation: linear
hidden_size: 256
initial_forget_bias: 3
output_dropout: 0.4

# --- Training ---
optimizer: Adam
loss: NSE                # basin-averaged NSE loss (Kratzert et al. 2019)
learning_rate:
  0: 1e-3
  20: 5e-4
  25: 1e-4
batch_size: 256
epochs: 30
clip_gradient_norm: 1
predict_last_n: 1
seq_length: 365
num_workers: 8
log_interval: 5
log_tensorboard: True
save_weights_every: 1
save_validation_results: True

# --- Data ---
dataset: camels_us
data_dir: ./data/CAMELS_US

forcings:
  - daymet

# Single forcing product => plain column names (no _daymet suffix)
dynamic_inputs:
  - prcp(mm/day)
  - srad(W/m2)
  - tmax(C)
  - tmin(C)
  - vp(Pa)

target_variables:
  - QObs(mm/d)

clip_targets_to_zero:
  - QObs(mm/d)

# --- The 27 static attributes from Kratzert et al. (2019) ---
# (all CAMELS attributes minus his INVALID_ATTR exclusions and lat/lon)
static_attributes:
  # climate (9)
  - p_mean
  - pet_mean
  - p_seasonality
  - frac_snow
  - aridity
  - high_prec_freq
  - high_prec_dur
  - low_prec_freq
  - low_prec_dur
  # topography (3)
  - elev_mean
  - slope_mean
  - area_gages2
  # vegetation (5)
  - frac_forest
  - lai_max
  - lai_diff
  - gvf_max
  - gvf_diff
  # soil (8)
  - soil_depth_pelletier
  - soil_depth_statsgo
  - soil_porosity
  - soil_conductivity
  - max_water_content
  - sand_frac
  - silt_frac
  - clay_frac
  # geology (2)
  - carbonate_rocks_frac
  - geol_permeability
